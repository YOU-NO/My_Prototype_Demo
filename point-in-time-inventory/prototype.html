<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>时点库存原型</title>
  <style>
    :root {
      --primary: #3573ff;
      --primary-weak: #eaf3ff;
      --primary-border: #b9d8ff;
      --danger: #f56c6c;
      --text: #303133;
      --regular: #606266;
      --secondary: #909399;
      --placeholder: #c0c4cc;
      --border: #ebeef5;
      --border-dark: #dcdfe6;
      --table-head: #f5f7fa;
      --page-bg: #f5f7fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--page-bg);
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 12px;
    }
    .layout { display: grid; grid-template-columns: 210px 1fr; min-height: 100vh; }
    .aside-box { width: 210px; height: 100vh; background: #fff; box-shadow: 0 1px 10px rgb(0 0 0 / 10%); }
    .el-menu-mock { margin: 0; padding: 0; list-style: none; }
    .el-sub-menu__title, .el-menu-item {
      position: relative; height: 52px; display: flex; align-items: center; color: #333; font-size: 12px; white-space: nowrap;
    }
    .el-sub-menu__title { padding: 0 28px; }
    .el-menu-item { padding: 0 20px 0 52px; }
    .el-menu-item.is-active { color: var(--primary); background: var(--primary-weak); }
    .el-menu-item.is-active::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 4px; background: var(--primary); }
    .menu-icon { width: 16px; height: 16px; display: inline-flex; margin-right: 8px; flex: none; }
    .menu-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .submenu-arrow { margin-left: auto; color: #909399; }
    .main { min-width: 0; padding: 8px 9px 16px; }
    .table-search {
      padding: 10px 10px 0; margin: 0 0 10px; background: #fff;
    }
    .search-row { display: flex; align-items: center; flex-wrap: wrap; }
    .field { position: relative; min-width: 160px; margin: 0 8px 8px 0; }
    .el-input__wrapper {
      height: 24px; display: flex; align-items: center; gap: 4px; padding: 0 8px;
      background: #fff; border: 1px solid var(--border-dark); border-radius: 4px; box-sizing: border-box;
    }
    .el-input__wrapper.is-focus { border-color: var(--primary); }
    .sku-filter { display: flex; min-width: 394px; height: 24px; margin: 0 8px 8px 0; align-items: stretch; }
    .sku-filter .sku-select,
    .sku-filter .sku-mode {
      height: 24px; padding: 0 8px; color: var(--regular); background: #fff;
      border: 1px solid var(--border-dark); border-radius: 4px 0 0 4px; outline: none; font-size: 12px;
    }
    .sku-filter .sku-mode { margin-left: -1px; border-radius: 0; }
    .sku-filter .sku-input {
      flex: 1; min-width: 190px; height: 24px; padding: 0 8px; color: var(--regular);
      border: 1px solid var(--border-dark); border-left: 0; border-radius: 0 4px 4px 0; outline: none; font-size: 12px;
    }
    .sku-filter .sku-select:focus,
    .sku-filter .sku-mode:focus,
    .sku-filter .sku-input:focus { border-color: var(--primary); }
    .sku-filter .sku-input::placeholder { color: #a8abb2; }
    .el-input__inner {
      flex: 1; width: 100%; min-width: 0; height: 22px; padding: 0; color: var(--regular);
      background: transparent; border: 0; outline: none; font-size: 12px; line-height: 22px;
    }
    .el-input__inner::placeholder { color: #a8abb2; }
    .el-input__suffix { width: 14px; height: 14px; display: inline-flex; flex: none; color: #a8abb2; }
    .el-input__suffix svg { width: 14px; height: 14px; }
    .field .clear { display: none; cursor: pointer; }
    .field.is-disabled { cursor: not-allowed; }
    .field.is-disabled .el-input__wrapper { background: #f5f7fa; cursor: not-allowed; }
    .field.is-disabled .el-input__inner { color: var(--placeholder); cursor: not-allowed; }
    .field.has-value:hover .arrow,
    .field.has-value:hover .calendar { display: none; }
    .field.has-value:hover .clear { display: inline-flex; }
    .field.is-open .arrow svg { transform: rotate(180deg); }
    .dropdown, .date-panel {
      position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; background: #fff;
      border: 1px solid #e4e7ed; border-radius: 4px; box-shadow: 0 2px 12px rgb(0 0 0 / 10%);
    }
    .dropdown { min-width: 100%; max-height: 274px; padding: 6px 0; overflow: auto; }
    .dropdown[hidden], .date-panel[hidden] { display: none !important; }
    .option {
      height: 34px; padding: 0 12px; color: var(--regular); font-size: 12px; line-height: 34px;
      white-space: nowrap; cursor: pointer;
    }
    .option:hover { background: #f5f7fa; }
    .option.is-selected { color: var(--primary); font-weight: 700; }
    .option.empty { color: var(--secondary); cursor: default; }
    .option.empty:hover { background: transparent; }
    .date-panel { display: flex; width: 438px; }
    .shortcuts { width: 110px; padding: 8px 0; border-right: 1px solid var(--border); }
    .shortcuts button {
      width: 100%; height: 28px; padding: 0 12px; color: var(--regular); background: transparent;
      border: 0; font-size: 12px; text-align: left; cursor: pointer;
    }
    .shortcuts button:hover:not(:disabled) { color: var(--primary); background: #f5f7fa; }
    .shortcuts button:disabled { color: var(--placeholder); cursor: not-allowed; }
    .calendar-pane { flex: 1; padding: 8px 12px 12px; }
    .cal-header { height: 28px; display: flex; align-items: center; justify-content: space-between; }
    .cal-header strong { font-size: 14px; font-weight: 500; }
    .cal-nav {
      width: 24px; height: 24px; color: var(--regular); background: transparent; border: 0; border-radius: 50%; cursor: pointer;
    }
    .cal-nav:hover { color: var(--primary); }
    .cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .cal-week span { height: 28px; color: var(--regular); font-size: 12px; line-height: 28px; text-align: center; }
    .day {
      height: 30px; display: flex; align-items: center; justify-content: center; padding: 0; background: transparent; border: 0; cursor: pointer;
    }
    .day span {
      width: 24px; height: 24px; border-radius: 50%; color: var(--regular); font-size: 12px; line-height: 24px; text-align: center;
    }
    .day.out span { color: #c0c4cc; }
    .day.today span { color: var(--primary); font-weight: 700; }
    .day.selected span { color: #fff; background: var(--primary); font-weight: 400; }
    .day:hover:not(.disabled):not(.selected) span { color: var(--primary); }
    .day.disabled { cursor: not-allowed; }
    .day.disabled span { color: #c0c4cc; background: transparent; }
    .operation { display: flex; align-items: center; margin: 0 8px 8px 0; }
    .el-button {
      height: 24px; display: inline-flex; align-items: center; padding: 5px 11px;
      color: var(--regular); background: #fff; border: 1px solid var(--border-dark); border-radius: 3px;
      font-size: 12px; line-height: 1; cursor: pointer;
    }
    .el-button + .el-button { margin-left: 8px; }
    .el-button .el-icon { width: 12px; height: 12px; margin-right: 6px; }
    .el-button--primary { color: #fff; background: var(--primary); border-color: var(--primary); }
    .el-button:hover { color: var(--primary); border-color: #c2d4ff; background: #f4f7ff; }
    .el-button--primary:hover { color: #fff; background: #5c8cff; border-color: #5c8cff; }
    button, input { font-family: inherit; }
    .btn {
      height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px;
      color: var(--regular); background: #fff; border: 1px solid var(--border-dark); border-radius: 3px; font-size: 12px; cursor: pointer;
    }
    .btn.primary { color: #fff; background: var(--primary); border-color: var(--primary); }
    .btn.light { color: #2f73d9; background: var(--primary-weak); border-color: var(--primary-border); }
    .btn:disabled { color: var(--placeholder); background: #f5f7fa; border-color: var(--border); cursor: not-allowed; }
    .table-shell { background: #fff; border: 1px solid var(--border); border-radius: 2px; }
    .table-toolbar { height: 40px; display: flex; align-items: center; padding: 0 10px; border-bottom: 1px solid var(--border); }
    .point-table { table-layout: fixed; }
    .point-table th { position: relative; }
    .point-table .column-resizer {
      position: absolute; top: 0; right: -3px; bottom: 0; z-index: 5; width: 7px; cursor: col-resize;
    }
    .point-table .column-resizer::after {
      content: ""; position: absolute; top: 7px; bottom: 7px; left: 3px; width: 1px; background: transparent;
    }
    .point-table th:hover .column-resizer::after,
    .point-table .column-resizer.is-dragging::after { background: var(--primary); }
    .point-table th:nth-child(3),
    .point-table td:nth-child(3) { overflow: hidden; text-overflow: ellipsis; }
    .point-table th:nth-child(n+4),
    .point-table td:nth-child(n+4) { text-align: center !important; }
    table { width: 100%; border-collapse: collapse; }
    th, td { height: 28px; padding: 0 10px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { height: 30px; color: var(--regular); background: var(--table-head); font-weight: 600; text-align: left; }
    td.num, th.num { text-align: right; }
    td.neg { color: var(--danger); font-weight: 600; }
    .help { display: inline-flex; align-items: center; gap: 4px; }
    .help i {
      position: relative; width: 13px; height: 13px; border-radius: 50%; background: #303133; color: #fff; font-style: normal;
      font-size: 10px; line-height: 13px; text-align: center; cursor: help;
    }
    .help i::after {
      content: attr(data-tooltip); position: absolute; right: 0; bottom: calc(100% + 9px);
      z-index: 40; display: none; width: 460px; padding: 8px 12px;
      color: #fff; background: #303133; border-radius: 4px; font-size: 12px; font-weight: 400;
      line-height: 18px; white-space: nowrap;
      box-shadow: 0 2px 12px rgb(0 0 0 / 10%);
    }
    .help i::before {
      content: ""; position: absolute; right: 3px; bottom: calc(100% + 4px); z-index: 41;
      display: none; width: 0; height: 0; border: 5px solid transparent; border-top-color: #303133;
    }
    .help i:hover::after,
    .help i:hover::before { display: block; }
    .empty { padding: 28px 0; color: var(--secondary); text-align: center; }
    .toast {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 30;
      min-width: 220px; padding: 8px 14px; color: #303133; background: #fff; border: 1px solid var(--border);
      border-radius: 4px; box-shadow: 0 2px 12px rgb(0 0 0 / 10%); text-align: center;
    }
    .toast.warn, .toast.error { color: #303133; background: #fff; }
    .mask { position: fixed; inset: 0; background: rgb(0 0 0 / 45%); display: flex; align-items: center; justify-content: center; z-index: 20; }
.mask[hidden] { display: none !important; }
    .dialog { width: 420px; background: #fff; border-radius: 4px; box-shadow: 0 8px 24px rgb(0 0 0 / 18%); }
    .dialog h3 { margin: 0; padding: 14px 16px 8px; font-size: 16px; font-weight: 600; }
    .dialog p { margin: 0; padding: 8px 16px 16px; color: var(--regular); line-height: 20px; }
    .dialog-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 0 16px 14px; }
    .el-menu-item { cursor: pointer; }
    .page[hidden] { display: none !important; }
    select.el-input__inner { appearance: none; cursor: pointer; }
    .tabs { display: flex; margin: 0 0 10px; background: #fff; border-bottom: 1px solid var(--border); }
    .tab {
      height: 36px; padding: 0 16px; color: var(--regular); background: transparent; border: 0;
      border-bottom: 2px solid transparent; font-size: 12px; cursor: pointer;
    }
    .tab.is-active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
    .tag { display: inline-block; min-width: 56px; padding: 0 6px; border-radius: 2px; line-height: 18px; text-align: center; }
    .tag.avail { color: #2f73d9; background: #eaf3ff; }
    .tag.lock { color: #b88230; background: #fdf6ec; }
    .tag.other { color: #909399; background: #f4f4f5; }
    td.neg-qty { color: var(--danger); }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="aside-box">
        <nav class="el-menu-mock">
          <div class="el-sub-menu__title"><span class="menu-icon"><svg viewBox="0 0 16 16"><path d="M4 2.5h6l2 2v9H4z"/><path d="M10 2.5v2h2"/><path d="M6 8h4"/><path d="M6 10.5h3"/></svg></span><span>库存同步</span><span class="submenu-arrow">⌄</span></div>
          <div class="el-sub-menu__title"><span class="menu-icon"><svg viewBox="0 0 16 16"><path d="M3 7.5 8 3l5 4.5"/><path d="M4.5 7v5.5h7V7"/><path d="M6.5 12.5V9h3v3.5"/></svg></span><span>退货管理</span><span class="submenu-arrow">⌄</span></div>
          <div class="el-sub-menu__title"><span class="menu-icon"><svg viewBox="0 0 16 16"><path d="M3 4h10v10H3z"/><path d="M5 2h6v3H5z"/><path d="M5.5 8h5"/><path d="M5.5 10.5h4"/></svg></span><span>库存管理</span><span class="submenu-arrow">⌃</span></div>
          <div class="el-menu-item" data-page="log"><span class="menu-icon"><svg viewBox="0 0 16 16"><path d="M4 2.5h7.5L13 4v9.5H4z"/><path d="M6 7h4"/><path d="M6 9.5h4"/></svg></span><span>出入库日志</span></div>
          <div class="el-menu-item"><span class="menu-icon"><svg viewBox="0 0 16 16"><path d="m8 2.5 5 2.8-5 2.8-5-2.8z"/><path d="M3 5.3v5.4l5 2.8 5-2.8V5.3"/></svg></span><span>汇总库存</span></div>
          <div class="el-menu-item is-active" data-page="point"><span class="menu-icon"><svg viewBox="0 0 16 16"><path d="M3 3.5h10v9H3z"/><path d="M3 6.5h10"/><path d="M6 6.5v6"/></svg></span><span>时点库存</span></div>
          <div class="el-menu-item"><span class="menu-icon"><svg viewBox="0 0 16 16"><path d="m8 2.5 5 2.6-5 2.6-5-2.6z"/><path d="m3 8 5 2.6L13 8"/></svg></span><span>层级库存</span></div>
          <div class="el-menu-item"><span class="menu-icon"><svg viewBox="0 0 16 16"><path d="M3.5 3.5h9v9h-9z"/><path d="M6 6h4"/><path d="M6 8h4"/></svg></span><span>库存水位</span></div>
          <div class="el-menu-item"><span class="menu-icon"><svg viewBox="0 0 16 16"><path d="M4 3.5h8v10H4z"/><path d="M6 6h4"/><path d="M6 8.5h4"/></svg></span><span>盘点单</span></div>
          <div class="el-menu-item"><span class="menu-icon"><svg viewBox="0 0 16 16"><path d="M5 2.5h6v11H5z"/><path d="M3.5 5h9"/></svg></span><span>加工单</span></div>
          <div class="el-sub-menu__title"><span class="menu-icon"><svg viewBox="0 0 16 16"><path d="M3 11.5h10"/><path d="m10.5 8 2.5 3.5-2.5 2"/><path d="M13 4.5H3"/></svg></span><span>调拨管理</span><span class="submenu-arrow">⌄</span></div>
          <div class="el-sub-menu__title"><span class="menu-icon"><svg viewBox="0 0 16 16"><path d="M2.5 4h8v6.5h-8z"/><path d="M10.5 6h2l1 2v2.5h-3z"/></svg></span><span>发货管理</span><span class="submenu-arrow">⌄</span></div>
          <div class="el-sub-menu__title"><span class="menu-icon"><svg viewBox="0 0 16 16"><path d="M3 5h10v8H3z"/><path d="M5 3h6v2H5z"/></svg></span><span>出入库</span><span class="submenu-arrow">⌄</span></div>
          <div class="el-sub-menu__title"><span class="menu-icon"><svg viewBox="0 0 16 16"><path d="M2.5 7 8 3l5.5 4"/><path d="M4 6.5v6h8v-6"/></svg></span><span>仓储设置</span><span class="submenu-arrow">⌄</span></div>
        </nav>
      </div>
    </aside>
    <main class="main">
      <div id="pagePoint">
      <div class="table-search">
        <div class="search-row">
          <div class="field" id="warehouseField">
            <div class="el-input__wrapper" id="warehouseWrap">
              <input id="warehouseInput" class="el-input__inner" placeholder="仓库名称" autocomplete="off" aria-label="仓库名称" />
              <span class="el-input__suffix arrow" aria-hidden="true"><svg viewBox="0 0 1024 1024"><path fill="currentColor" d="M831.872 340.864 512 652.672 192.128 340.864a30.592 30.592 0 0 0-42.752 0 29.12 29.12 0 0 0 0 41.6L489.664 714.24a32 32 0 0 0 44.672 0l340.288-331.712a29.12 29.12 0 0 0 0-41.728 30.592 30.592 0 0 0-42.752 0z"/></svg></span>
              <span class="el-input__suffix clear" id="warehouseClear" aria-label="清空仓库"><svg viewBox="0 0 1024 1024"><path fill="currentColor" d="M512 64a448 448 0 1 1 0 896 448 448 0 0 1 0-896m0 393.664L407.936 353.6a38.4 38.4 0 1 0-54.336 54.336L457.664 512 353.6 616.064a38.4 38.4 0 1 0 54.336 54.336L512 566.336l104.064 104.064a38.4 38.4 0 1 0 54.336-54.336L566.336 512l104.064-104.064a38.4 38.4 0 0 0-54.336-54.336z"/></svg></span>
            </div>
            <div class="dropdown" id="warehouseMenu" hidden></div>
          </div>
          <div class="sku-filter" aria-label="SKU筛选">
            <select id="skuField" class="sku-select" aria-label="筛选字段">
              <option value="sku">SKU</option>
            </select>
            <select id="skuMode" class="sku-mode" aria-label="匹配方式">
              <option value="exact">精确</option>
              <option value="contains">模糊</option>
            </select>
            <input id="skuInput" class="sku-input" placeholder="双击批量查询" autocomplete="off" aria-label="SKU查询值" />
          </div>
          <div class="field is-disabled" id="levelField" hidden>
            <div class="el-input__wrapper" id="levelWrap">
              <input id="levelInput" class="el-input__inner" placeholder="请选择" readonly disabled aria-label="库存层级" />
              <span class="el-input__suffix arrow" aria-hidden="true"><svg viewBox="0 0 1024 1024"><path fill="currentColor" d="M831.872 340.864 512 652.672 192.128 340.864a30.592 30.592 0 0 0-42.752 0 29.12 29.12 0 0 0 0 41.6L489.664 714.24a32 32 0 0 0 44.672 0l340.288-331.712a29.12 29.12 0 0 0 0-41.728 30.592 30.592 0 0 0-42.752 0z"/></svg></span>
              <span class="el-input__suffix clear" id="levelClear" aria-label="清空层级"><svg viewBox="0 0 1024 1024"><path fill="currentColor" d="M512 64a448 448 0 1 1 0 896 448 448 0 0 1 0-896m0 393.664L407.936 353.6a38.4 38.4 0 1 0-54.336 54.336L457.664 512 353.6 616.064a38.4 38.4 0 1 0 54.336 54.336L512 566.336l104.064 104.064a38.4 38.4 0 1 0 54.336-54.336L566.336 512l104.064-104.064a38.4 38.4 0 0 0-54.336-54.336z"/></svg></span>
            </div>
            <div class="dropdown" id="levelMenu" hidden></div>
          </div>
          <div class="field" id="dateField">
            <div class="el-input__wrapper" id="dateWrap">
              <input id="dateInput" class="el-input__inner" placeholder="日期" readonly aria-label="日期" />
              <span class="el-input__suffix calendar" aria-hidden="true"><svg viewBox="0 0 1024 1024"><path fill="currentColor" d="M128 384v512h768V192H768v32a32 32 0 1 1-64 0v-32H320v32a32 32 0 0 1-64 0v-32H128v128h768v64H128zm192-256h384V96a32 32 0 1 1 64 0v32h160a32 32 0 0 1 32 32v768a32 32 0 0 1-32 32H96a32 32 0 0 1-32-32V160a32 32 0 0 1 32-32h160V96a32 32 0 0 1 64 0zm-32 384h64a32 32 0 0 1 0 64h-64a32 32 0 0 1 0-64m0 192h64a32 32 0 1 1 0 64h-64a32 32 0 1 1 0-64m192-192h64a32 32 0 0 1 0 64h-64a32 32 0 0 1 0-64m0 192h64a32 32 0 1 1 0 64h-64a32 32 0 1 1 0-64m192-192h64a32 32 0 1 1 0 64h-64a32 32 0 1 1 0-64m0 192h64a32 32 0 1 1 0 64h-64a32 32 0 1 1 0-64"/></svg></span>
              <span class="el-input__suffix clear" id="dateClear" aria-label="清空日期"><svg viewBox="0 0 1024 1024"><path fill="currentColor" d="M512 64a448 448 0 1 1 0 896 448 448 0 0 1 0-896m0 393.664L407.936 353.6a38.4 38.4 0 1 0-54.336 54.336L457.664 512 353.6 616.064a38.4 38.4 0 1 0 54.336 54.336L512 566.336l104.064 104.064a38.4 38.4 0 1 0 54.336-54.336L566.336 512l104.064-104.064a38.4 38.4 0 0 0-54.336-54.336z"/></svg></span>
            </div>
            <div class="date-panel" id="datePanel" hidden>
              <div class="shortcuts">
                <button type="button" data-shortcut="0">今日</button>
                <button type="button" data-shortcut="-1">昨日</button>
                <button type="button" data-shortcut="-7">上周</button>
                <button type="button" data-shortcut="-30">上月</button>
              </div>
              <div class="calendar-pane">
                <div class="cal-header">
                  <button type="button" class="cal-nav" id="prevMonth" aria-label="上个月">‹</button>
                  <strong id="calTitle"></strong>
                  <button type="button" class="cal-nav" id="nextMonth" aria-label="下个月">›</button>
                </div>
                <div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
                <div class="cal-grid" id="calGrid"></div>
              </div>
            </div>
          </div>
          <div class="operation">
            <button class="el-button el-button--primary" id="searchBtn" type="button">
              <svg class="el-icon" viewBox="0 0 1024 1024" aria-hidden="true"><path fill="currentColor" d="m795.904 750.72 124.992 124.928a32 32 0 0 1-45.248 45.248L750.656 795.904a416 416 0 1 1 45.248-45.248zM480 832a352 352 0 1 0 0-704 352 352 0 0 0 0 704"/></svg>

    function initColumnResizers() {
      const table = document.querySelector(".point-table");
      const cols = [...table.querySelectorAll("col")];
      const handles = [...table.querySelectorAll(".column-resizer")];
      handles.slice(0, -1).forEach((handle, index) => {
        handle.addEventListener("mousedown", (event) => {
          event.preventDefault();
          const leftWidth = cols[index].getBoundingClientRect().width;
          const rightWidth = cols[index + 1].getBoundingClientRect().width;
          const minLeft = index < 3 ? 100 : 90;
          const minRight = index + 1 < 3 ? 100 : 90;
          const startX = event.clientX;
          handle.classList.add("is-dragging");
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";

          const onMove = (moveEvent) => {
            const requestedDelta = moveEvent.clientX - startX;
            const delta = Math.max(minLeft - leftWidth, Math.min(rightWidth - minRight, requestedDelta));
            cols[index].style.width = `${leftWidth + delta}px`;
            cols[index + 1].style.width = `${rightWidth - delta}px`;
          };
          const onUp = () => {
            handle.classList.remove("is-dragging");
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onUp);
          };
          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
        });
      });
    }

      toastEl.textContent = text;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2000);
    }

    function accountingDate(doc) {
      return (doc.boundTime || doc.createTime).slice(0, 10);
    }

    function inWindow(doc, day) {
      const monthStart = day.slice(0, 7) + "-01";
      const date = accountingDate(doc);
      return date >= monthStart && date <= day;
    }

    function snapshotEnd(day) {
      return addDays(day.slice(0, 7) + "-01", -1);
    }

    function allDocuments() {
      return data.documents.map((doc, index) => ({
        ...doc,
        documentType: doc.direction === "in" ? "入库单" : "出库单",
        documentNo: (doc.direction === "in" ? "IB-" : "OB-") + String(index + 1).padStart(4, "0"),
        accountingDate: accountingDate(doc),
        signedQty: doc.direction === "in" ? doc.qty : -doc.qty
      }));
    }

    function skuMatches(sku) {
      const keywords = skuInput.value.trim().split(/[\s,，;；]+/).filter(Boolean);
      if (!keywords.length) return true;
      if (skuMode.value === "contains") {
        return keywords.some((keyword) => sku.toLowerCase().includes(keyword.toLowerCase()));
      }
      return keywords.some((keyword) => sku.toLowerCase() === keyword.toLowerCase());
    }

    function calculate(warehouse, day) {
      const snapshotRows = data.snapshots[warehouse] || [];
      const snapshotDate = snapshotEnd(day);
      const generatedAt = data.snapshotGeneratedAt[warehouse] || "";
      const map = new Map(snapshotRows.map((item) => [
        item.sku,
        {
          warehouseName: warehouse,
          sku: item.sku,
          skuName: item.skuName,
          openingQty: (item.availableQty || 0) + (item.lockedQty || 0),
          historicalInboundQty: 0,
          historicalOutboundQty: 0,
          inboundQty: 0,
          outboundQty: 0
        }
      ]));
      allDocuments().filter((doc) => {
        if (doc.warehouseName !== warehouse) return false;
        const isHistorical = generatedAt && doc.createTime > generatedAt && doc.accountingDate <= snapshotDate;
        const isPeriod = doc.accountingDate > snapshotDate && doc.accountingDate <= day;
        return isHistorical || isPeriod;
      }).forEach((doc) => {
        if (!map.has(doc.sku)) {
          map.set(doc.sku, {
            warehouseName: warehouse,
            sku: doc.sku,
            skuName: doc.skuName,
            openingQty: 0,
            historicalInboundQty: 0,
            historicalOutboundQty: 0,
            inboundQty: 0,
            outboundQty: 0
          });
        }
        const row = map.get(doc.sku);
        const isHistorical = generatedAt && doc.createTime > generatedAt && doc.accountingDate <= snapshotDate;
        if (isHistorical) {
          if (doc.direction === "in") row.historicalInboundQty += doc.qty;
          else row.historicalOutboundQty += doc.qty;
        } else if (doc.direction === "in") {
          row.inboundQty += doc.qty;
        } else {
          row.outboundQty += doc.qty;
        }
      });
      return Array.from(map.values()).map((row) => ({
        ...row,
        pointQty: row.openingQty + row.historicalInboundQty - row.historicalOutboundQty + row.inboundQty - row.outboundQty
      })).filter((row) => skuMatches(row.sku)).sort((a, b) => a.sku.localeCompare(b.sku));
    }

    function render(list) {
      rows = list;
      exportBtn.disabled = list.length === 0;
      if (!list.length) {
        bodyEl.innerHTML = '<tr><td class="empty" colspan="9">暂无数据</td></tr>';
        return;
      }
      bodyEl.innerHTML = list.map((row) => {
        const pointClass = row.pointQty < 0 ? "num neg" : "num";
        return `<tr><td>${row.warehouseName}</td><td>${row.sku}</td><td>${row.skuName}</td><td class="num">${row.openingQty}</td><td class="num">${row.historicalInboundQty}</td><td class="num">${row.historicalOutboundQty}</td><td class="num">${row.inboundQty}</td><td class="num">${row.outboundQty}</td><td class="${pointClass}">${row.pointQty}</td></tr>`;
      }).join("");
    }

    function isoFromDate(date) {
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return date.getFullYear() + "-" + month + "-" + day;
    }

    function parseIso(iso) {
      const parts = iso.split("-").map(Number);
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function addDays(iso, days) {
      const date = parseIso(iso);
      date.setDate(date.getDate() + days);
      return isoFromDate(date);
    }

    function inRange(iso) {
      return iso >= dateMin && iso <= dateMax;
    }

    function syncWarehouseInput() {
      whInput.value = warehouseValue;
      whField.classList.toggle("has-value", Boolean(warehouseValue));
    }

    function syncDateInput() {
      dateInput.value = dateValue;
      dateField.classList.toggle("has-value", Boolean(dateValue));
    }

    function closeWarehouse() {
      whMenu.hidden = true;
      whField.classList.remove("is-open");
      whWrap.classList.remove("is-focus");
      syncWarehouseInput();
    }

    function closeDate() {
      datePanel.hidden = true;
      dateField.classList.remove("is-open");
      dateWrap.classList.remove("is-focus");
    }

    function renderWarehouseMenu(keyword) {
      const text = (keyword || "").trim().toLowerCase();
      const list = data.warehouses.filter((name) => name.toLowerCase().includes(text));
      whMenu.innerHTML = list.length
        ? list.map((name) => `<div class="option${name === warehouseValue ? " is-selected" : ""}" data-name="${name}">${name}</div>`).join("")
        : '<div class="option empty">无匹配数据</div>';
    }

    function openWarehouse() {
      closeLevel();
      closeDate();
      whMenu.hidden = false;
      whField.classList.add("is-open");
      whWrap.classList.add("is-focus");
      renderWarehouseMenu(whInput.value === warehouseValue ? "" : whInput.value);
    }

    const levelField = document.getElementById("levelField");
    const levelWrap = document.getElementById("levelWrap");
    const levelInput = document.getElementById("levelInput");
    const levelMenu = document.getElementById("levelMenu");

    function levelsOf(warehouse) {
      return data.levelsByWarehouse[warehouse] || [];
    }

    function levelFor(warehouse, sku) {
      const levels = levelsOf(warehouse);
      if (!levels.length) return "";
      if (levels.length === 1) return levels[0];
      let hash = 0;
      for (let i = 0; i < sku.length; i += 1) hash += sku.charCodeAt(i);
      return levels[hash % levels.length];
    }

    function syncLevelInput() {
      levelInput.value = levelValue;
      const enabled = Boolean(warehouseValue);
      levelField.classList.toggle("is-disabled", !enabled);
      levelField.classList.toggle("has-value", Boolean(levelValue));
      levelInput.disabled = !enabled;
    }

    function closeLevel() {
      levelMenu.hidden = true;
      levelField.classList.remove("is-open");
      levelWrap.classList.remove("is-focus");
      syncLevelInput();
    }

    function renderLevelMenu() {
      const list = levelsOf(warehouseValue);
      levelMenu.innerHTML = list.length
        ? list.map((name) => `<div class="option${name === levelValue ? " is-selected" : ""}" data-name="${name}">${name}</div>`).join("")
        : '<div class="option empty">无匹配数据</div>';
    }

    function openLevel() {
      if (!warehouseValue) return;
      closeWarehouse();
      closeDate();
      renderLevelMenu();
      levelMenu.hidden = false;
      levelField.classList.add("is-open");
      levelWrap.classList.add("is-focus");
    }

    function setLevel(name) {
      levelValue = name || "";
      closeLevel();
    }

    function fillLevels(select, warehouse) {
      const names = levelsOf(warehouse);
      select.disabled = !warehouse;
      select.innerHTML = '<option value="">请选择</option>' + names.map((name) => `<option>${name}</option>`).join("");
      select.value = "";
    }

    function setWarehouse(name) {
      warehouseValue = name || "";
      levelValue = "";
      closeWarehouse();
      closeLevel();
    }

    function renderCalendar() {
      calTitle.textContent = viewYear + " 年 " + (viewMonth + 1) + " 月";
      const first = new Date(viewYear, viewMonth, 1);
      const start = new Date(viewYear, viewMonth, 1 - ((first.getDay() + 6) % 7));
      const cells = [];
      for (let i = 0; i < 42; i += 1) {
        const date = new Date(start);
        date.setDate(start.getDate() + i);
        const iso = isoFromDate(date);
        const classes = ["day"];
        if (date.getMonth() !== viewMonth) classes.push("out");
        if (iso === data.today) classes.push("today");
        if (iso === dateValue) classes.push("selected");
        if (!inRange(iso)) classes.push("disabled");
        cells.push(`<button type="button" class="${classes.join(" ")}" data-date="${iso}"${inRange(iso) ? "" : " disabled"}><span>${date.getDate()}</span></button>`);
      }
      calGrid.innerHTML = cells.join("");
    }

    function openDate() {
      closeWarehouse();
      closeLevel();
      const base = parseIso(dateValue || dateMax);
      viewYear = base.getFullYear();
      viewMonth = base.getMonth();
      renderCalendar();
      datePanel.querySelectorAll(".shortcuts button").forEach((button) => {
        button.disabled = !inRange(addDays(data.today, Number(button.dataset.shortcut)));
      });
      datePanel.hidden = false;
      dateField.classList.add("is-open");
      dateWrap.classList.add("is-focus");
      dateInput.focus();
    }

    function setDate(iso) {
      if (iso && !inRange(iso)) {
        showToast("日期需在上线月份月末之后，且不能晚于今天", "warn");
        return;
      }
      dateValue = iso || "";
      syncDateInput();
      closeDate();
    }

    whInput.addEventListener("focus", () => {
      whInput.select();
      openWarehouse();
    });
    whInput.addEventListener("input", () => {
      if (whMenu.hidden) openWarehouse();
      renderWarehouseMenu(whInput.value);
    });
    whInput.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeWarehouse();
        return;
      }
      if (event.key !== "Enter") return;
      event.preventDefault();
      const visible = [...whMenu.querySelectorAll(".option[data-name]")];
      if (!whMenu.hidden && visible.length === 1) setWarehouse(visible[0].dataset.name);
      else closeWarehouse();
      document.getElementById("searchBtn").click();
    });
    whMenu.addEventListener("mousedown", (event) => {
      const option = event.target.closest(".option[data-name]");
      if (!option) return;
      event.preventDefault();
      setWarehouse(option.dataset.name);
    });
    document.getElementById("warehouseClear").addEventListener("mousedown", (event) => {
      event.preventDefault();
      event.stopPropagation();
      setWarehouse("");
      whInput.focus();
    });
    levelWrap.addEventListener("click", (event) => {
      if (!warehouseValue || event.target.closest("#levelClear")) return;
      if (levelMenu.hidden) openLevel();
      else closeLevel();
    });
    levelMenu.addEventListener("mousedown", (event) => {
      const option = event.target.closest(".option[data-name]");
      if (!option) return;
      event.preventDefault();
      setLevel(option.dataset.name);
    });
    document.getElementById("levelClear").addEventListener("mousedown", (event) => {
      event.preventDefault();
      event.stopPropagation();
      if (!warehouseValue) return;
      setLevel("");
    });
    dateWrap.addEventListener("click", (event) => {
      if (event.target.closest("#dateClear")) return;
      if (datePanel.hidden) openDate();
      else closeDate();
    });
    dateInput.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeDate();
      if (event.key === "Enter") {
        event.preventDefault();
        document.getElementById("searchBtn").click();
      }
    });
    document.getElementById("dateClear").addEventListener("mousedown", (event) => {
      event.preventDefault();
      event.stopPropagation();
      setDate("");
    });
    document.getElementById("prevMonth").addEventListener("click", (event) => {
      event.stopPropagation();
      viewMonth -= 1;
      if (viewMonth < 0) {
        viewMonth = 11;
        viewYear -= 1;
      }
      renderCalendar();
    });
    document.getElementById("nextMonth").addEventListener("click", (event) => {
      event.stopPropagation();
      viewMonth += 1;
      if (viewMonth > 11) {
        viewMonth = 0;
        viewYear += 1;
      }
      renderCalendar();
    });
    calGrid.addEventListener("click", (event) => {
      const button = event.target.closest(".day[data-date]");
      if (!button || button.disabled) return;
      setDate(button.dataset.date);
    });
    datePanel.querySelector(".shortcuts").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-shortcut]");
      if (!button || button.disabled) return;
      setDate(addDays(data.today, Number(button.dataset.shortcut)));
    });
    document.addEventListener("mousedown", (event) => {
      if (!whField.contains(event.target)) {
        const exact = data.warehouses.find((name) => name === whInput.value.trim());
        if (exact) warehouseValue = exact;
        closeWarehouse();
      }
      if (!levelField.contains(event.target)) closeLevel();
      if (!dateField.contains(event.target)) closeDate();
    });

    document.getElementById("searchBtn").onclick = () => {
      if (queryRunning) {
        showToast("上一次查询任务执行中，请稍后");
        return;
      }
      closeWarehouse();
      closeLevel();
      closeDate();
      const warehouse = warehouseValue;
      const day = dateValue;
      if (!warehouse || !day) {
        showToast("请选择仓库和日期", "warn");
        return;
      }
      if (!inRange(day)) {
        showToast("日期需在上线月份月末之后，且不能晚于今天", "warn");
        return;
      }
      if (data.missing.includes(warehouse)) {
        rows = [];
        exportBtn.disabled = true;
        bodyEl.innerHTML = '<tr><td class="empty" colspan="9">缺少 2026-10 期末快照，请先确认定时任务已成功</td></tr>';
        showToast("缺少 2026-10 期末快照", "error");
        return;
      }
      queryRunning = true;
      window.setTimeout(() => {
        queryRunning = false;
        render(calculate(warehouse, day));
      }, 600);
    };

    document.getElementById("resetBtn").onclick = () => {
      setWarehouse("");
      setDate("");
      skuInput.value = "";
      skuMode.value = "exact";
      rows = [];
      exportBtn.disabled = true;
      bodyEl.innerHTML = '<tr><td class="empty" colspan="9">请选择仓库和日期后查询</td></tr>';
      setLevel("");
    };

    skuInput.addEventListener("dblclick", () => {
      showToast("可输入多个 SKU，使用逗号或换行分隔", "warn");
    });
    skuInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") document.getElementById("searchBtn").click();
    });

    exportBtn.onclick = () => { document.getElementById("exportMask").hidden = false; };
    document.getElementById("exportCancel").onclick = () => { document.getElementById("exportMask").hidden = true; };
    document.getElementById("exportOk").onclick = () => {
      document.getElementById("exportMask").hidden = true;
      showToast("已创建导出任务，请稍后查看");
    };

    const logWarehouse = document.getElementById("logWarehouse");
    const logBody = document.getElementById("logBody");
    logWarehouse.innerHTML = '<option value="">请选择</option>' + data.warehouses.map((name) => `<option>${name}</option>`).join("");

    function renderLogs() {
      const sku = document.getElementById("logSku").value.trim().toLowerCase();
      const from = document.getElementById("logFrom").value;
      const to = document.getElementById("logTo").value;
      const list = allDocuments().filter((doc) => {
        if (logWarehouse.value && doc.warehouseName !== logWarehouse.value) return false;
        if (sku && !doc.sku.toLowerCase().includes(sku)) return false;
        if (from && doc.accountingDate < from) return false;
        if (to && doc.accountingDate > to) return false;
        return true;
      });
      logBody.innerHTML = list.length ? list.map((doc) => {
        const qtyClass = doc.signedQty < 0 ? "num neg-qty" : "num";
        return `<tr><td>${doc.warehouseName}</td><td>${doc.sku}</td><td>${doc.skuName}</td><td>${doc.documentType}</td><td>${doc.businessType}</td><td>${doc.documentNo}</td><td>${doc.accountingDate}</td><td class="${qtyClass}">${doc.signedQty > 0 ? "+" : ""}${doc.signedQty}</td></tr>`;
      }).join("") : '<tr><td class="empty" colspan="8">暂无数据</td></tr>';
    }

    document.getElementById("logSearch").onclick = renderLogs;
    document.getElementById("logReset").onclick = () => {
      logWarehouse.value = "";
      document.getElementById("logSku").value = "";
      document.getElementById("logFrom").value = "";
      document.getElementById("logTo").value = "";
      renderLogs();
    };
    document.getElementById("logExport").onclick = () => showToast("已创建导出任务，请稍后查看");

    function showPage(page) {
      document.getElementById("pagePoint").hidden = page !== "point";
      document.getElementById("pageLog").hidden = page !== "log";
      document.querySelectorAll(".el-menu-item[data-page]").forEach((item) => {
        item.classList.toggle("is-active", item.dataset.page === page);
      });
      if (page === "log" && !logBody.innerHTML) renderLogs();
    }

    document.querySelectorAll(".el-menu-item[data-page]").forEach((item) => {
      item.onclick = () => showPage(item.dataset.page);
    });

    initColumnResizers();

    const params = new URLSearchParams(location.search);
    if (params.get("state") === "result") {
      setWarehouse("万邑通澳洲仓");
      setDate("2026-11-04");
      document.getElementById("searchBtn").click();
    } else if (params.get("state") === "zero") {
      setWarehouse("万邑通德国仓");
      setDate("2026-11-04");
      document.getElementById("searchBtn").click();
    } else if (params.get("state") === "missing") {
      setWarehouse("筋斗云GLC仓");
      setDate("2026-11-04");
      document.getElementById("searchBtn").click();
    } else if (params.get("state") === "invalid") {
      document.getElementById("searchBtn").click();
    } else if (params.get("state") === "log") {
      logWarehouse.value = "万邑通澳洲仓";
      document.getElementById("logSku").value = "S810-ST-PK-UK-170-N";
      document.getElementById("logTo").value = "2026-11-04";
      showPage("log");
      renderLogs();
    } else if (params.get("state") === "export") {
      setWarehouse("万邑通澳洲仓");
      setDate("2026-11-04");
      document.getElementById("searchBtn").click();
      document.getElementById("exportMask").hidden = false;
    } else {
      setWarehouse("万邑通澳洲仓");
      setDate("2026-11-05");
      document.getElementById("searchBtn").click();
    }
  </script>
</body>
</html>
